[package]
name = "sims3"
edition.workspace = true
version.workspace = true

[[bin]]
name = "sims3"
path = "src/main.rs"

[dependencies]
s3pkg = { path = "../s3pkg" }
s3formats = { path = "../s3formats" }
s3bake = { path = "../s3bake" }
lz4_flex = "0.11"
bevy = { version = "0.19.1", features = ["dds", "debug", "mp3"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
